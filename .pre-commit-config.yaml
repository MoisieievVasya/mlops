# The hooks call the ruff pinned in uv.lock, so pre-commit, `make lint` and CI
# always run the exact same linter version. A hosted `rev:` could drift from the lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # feature_repo/feature_store.yaml is a Feast template: ${VAR} placeholders
        # are substituted at load time and are not valid YAML scalars to this hook.
        exclude: ^feature_repo/feature_store\.yaml$
      - id: check-toml
      - id: check-added-large-files
        # The archive is 83 MB and belongs to DVC. This hook is the backstop that
        # keeps it — or a model artifact — out of a commit by accident.
        args: [--maxkb=512]

  # Design 6.4 lists a secret scanner as a Lab 2 task. The .env holding the MinIO
  # root credentials and the author salt is gitignored, but "it is gitignored" is a
  # convention and this is a check.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
