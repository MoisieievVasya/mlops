# Tier-0 rule baseline — design 5.3, "hand-written keyword lexicon, first match wins".
#
# This is the honest "do we need ML at all" check and the documented fallback if the
# model service is down for a long outage. It is not a candidate for promotion: the
# design predicts it loses ~30 macro-F1 points to the TF-IDF baseline, and 7.2
# records whether that prediction held.
#
# Matching: the normalised headline + dek is scanned for each category's terms in the
# order below; a term matches on a word boundary; the first category with a match
# wins. No match -> the fallback category, which is the training set's majority class.
version: 1
fallback: _majority_class_

categories:
  SPORTS: [nfl, nba, mlb, nhl, super bowl, olympic, olympics, world cup, quarterback,
           touchdown, playoff, playoffs, coach, athlete, soccer, basketball, baseball,
           tennis, golf, boxing, ncaa, league]

