# newsflow — the local reference stack of design 6.2, one command.
#
#   make up        brings all of this up and waits for it to be healthy
#   make down      stops it, keeping the volumes
#   make nuke      stops it and deletes the volumes
#
# Ports are read from .env so that a laptop already running something on 5000 or
# 8080 can move them without editing this file.

name: newsflow

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # The dags folder is a bind mount, not a git bundle: a 5-minute default refresh
    # means an edited DAG looks broken for five minutes. 30s is the lab's answer.
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: newsflow-local-jwt-secret
    AIRFLOW__API__SECRET_KEY: newsflow-local-api-secret
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Local lab: no login wall in front of the UI. Nothing here is reachable off
    # the laptop (design 6.4 — the service ports are not published in production).
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # The project, as the DAGs see it.
    PYTHONPATH: /opt/project/src
    NEWSFLOW_PROJECT_ROOT: /opt/project
    NEWSFLOW_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/newsflow
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/project/src:ro
    - ./conf:/opt/project/conf:ro
    - ./sql:/opt/project/sql:ro
    - ./data:/opt/project/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # --- object store ---------------------------------------------------------------
  # The official MinIO images cannot be pulled anonymously any more; pgsty/silo is
  # the maintained build of the same server with the same API, ports and variables.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Buckets are created with the AWS CLI rather than `mc`, which is no longer
  # pullable either. Runs once and exits.
  minio-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/minio_init.sh:/minio_init.sh:ro
    entrypoint: ["/bin/sh", "/minio_init.sh"]

  # --- warehouse ------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: newsflow
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d newsflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- experiment tracking and model registry ---------------------------------------
  mlflow:
    build:
      context: ./docker/mlflow
    # --artifacts-destination + --serve-artifacts rather than --default-artifact-root:
    # the server owns the object store and clients address artifacts as
    # `mlflow-artifacts:/...`, which the server proxies. With a bare
    # --default-artifact-root the client talks to the store directly, which means it
    # needs S3 credentials of its own *and* it resolves `http://minio:9000` — the
    # endpoint as the server sees it — which does not exist on the laptop.
    command: >
      mlflow server
        --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
        --artifacts-destination s3://newsflow-mlflow/
        --serve-artifacts
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- orchestrator -----------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    command:
      - airflow db migrate && python /opt/project/src/newsflow/warehouse_init.py
    environment:
      <<: *airflow-env
      NEWSFLOW_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/newsflow
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-apiserver:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
  airflow-logs:
